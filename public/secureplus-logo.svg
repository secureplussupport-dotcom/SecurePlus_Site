  <rect width="160" height="160" rx="34" fill="url(#bg)"/>
  <path d="M24 126c21-9 35-7 53 2 21 10 39 8 59-3" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" opacity=".18"/>
  <path d="M30 34c18 6 36 5 50-4 14 9 32 10 50 4v37c0 31-18 57-50 74-32-17-50-43-50-74V34Z" fill="#020617" opacity=".42"/>

