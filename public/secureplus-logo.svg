    <circle r="24" fill="#ffffff" opacity=".08"/>
    <path d="M0-15v30M-15 0h30" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <path d="M0-15v30M-15 0h30" fill="none" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
