    <path d="M80 33c12 7 24 11 38 12v27c0 23-13 42-38 56-25-14-38-33-38-56V45c14-1 26-5 38-12Z" fill="#07111f" opacity=".82"/>
    <path d="M80 33c12 7 24 11 38 12v27c0 23-13 42-38 56V33Z" fill="url(#shine)"/>
    <path d="M80 20c15 9 31 14 48 15v37c0 29-17 53-48 69-31-16-48-40-48-69V35c17-1 33-6 48-15Z" fill="none" stroke="#93c5fd" stroke-width="3" opacity=".72"/>
