<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">SecurePlus logo</title>
  <desc id="desc">A modern blue and teal shield with a plus symbol for SecurePlus.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="142" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101a35"/>
      <stop offset=".48" stop-color="#07111f"/>
      <stop offset="1" stop-color="#082f35"/>
    </linearGradient>
    <linearGradient id="shield" x1="42" y1="24" x2="118" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset=".5" stop-color="#2f7df6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="shine" x1="51" y1="35" x2="105" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
